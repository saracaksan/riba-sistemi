let aktifSorular = [];
let secilenYanitlar = {};

function anketArayuzunuKur() {
    if(!tip || (tip !== 'Ogretmen' && !ogrenciId)) { 
        alert("Geçersiz giriş!"); window.location.href = '/'; return; 
    }

    let formBaslik = "Ortaokul Öğrenci Formu";
    if (tip === 'Veli') formBaslik = "Ortaokul Veli Formu";
    if (tip === 'Ogretmen') formBaslik = "Ortaokul Öğretmen Formu";

    document.getElementById('kullanici_bilgi').innerText = formBaslik;
    document.getElementById('yonerge_kutusu').innerHTML = yonergeler[tip];
    
    aktifSorular = sorular[tip];
    document.getElementById('toplam_soru').innerText = aktifSorular.length;
    
    const mainContainer = document.getElementById('anket_maddeleri');
    aktifSorular.forEach((soru, index) => {
        const kart = document.createElement('div');
        kart.className = 'madde-kart';
        
        // M1_A ve M1_B gibi kodlar oluşturuyoruz ki arka plandaki hesaplama şaşmasın
        let kodA = `M${(soru.qId * 2) - 1}`;
        let kodB = `M${soru.qId * 2}`;
        
        kart.innerHTML = `
            <div class="madde-no">${index + 1}. Madde</div>
            <button class="secenek-btn" id="Soru${soru.qId}_A" onclick="secimGuncelle(${soru.qId}, 'A', '${kodA}', '${kodB}')">
                <span class="secenek-harf">A)</span> ${soru.A}
            </button>
            <button class="secenek-btn" id="Soru${soru.qId}_B" onclick="secimGuncelle(${soru.qId}, 'B', '${kodA}', '${kodB}')">
                <span class="secenek-harf">B)</span> ${soru.B}
            </button>
        `;
        mainContainer.appendChild(kart);
    });
}

function secimGuncelle(qId, tercih, kodA, kodB) {
    document.getElementById(`Soru${qId}_A`).classList.remove('active');
    document.getElementById(`Soru${qId}_B`).classList.remove('active');
    document.getElementById(`Soru${qId}_${tercih}`).classList.add('active');
    
    // Yalnızca seçilen şıkka puan verilir
    if(tercih === 'A') {
        secilenYanitlar[kodA] = { "A": 1, "B": 0 };
        secilenYanitlar[kodB] = { "A": 0, "B": 0 };
    } else {
        secilenYanitlar[kodA] = { "A": 0, "B": 0 };
        secilenYanitlar[kodB] = { "A": 1, "B": 0 };
    }
    
    // Her soru için bir anahtar tutarak ilerlemeyi hesapla
    secilenYanitlar[`Cevaplandi_${qId}`] = true;
    
    // İlerlemeyi hesapla
    let cevaplananSayisi = 0;
    for(let i=1; i<=aktifSorular.length; i++) {
        if(secilenYanitlar[`Cevaplandi_${i}`]) cevaplananSayisi++;
    }
    
    const yuzdelik = Math.round((cevaplananSayisi / aktifSorular.length) * 100);
    
    document.getElementById('ilerleme').style.width = yuzdelik + '%';
    document.getElementById('yuzde_metin').innerText = '%' + yuzdelik;
    document.getElementById('cevaplanan_soru').innerText = cevaplananSayisi;
    
    if(yuzdelik === 100) {
        document.getElementById('kaydet_butonu').style.backgroundColor = '#10b981';
    }
}

function anketiKaydet() {
    let cevaplananSayisi = 0;
    for(let i=1; i<=aktifSorular.length; i++) {
        if(secilenYanitlar[`Cevaplandi_${i}`]) cevaplananSayisi++;
    }

    if (cevaplananSayisi < aktifSorular.length) {
        alert(`DİKKAT: Anket henüz tamamlanmadı!\nLütfen işaretlemediğiniz ${aktifSorular.length - cevaplananSayisi} maddeyi kontrol ediniz.`);
        return;
    }

    document.getElementById('kaydet_butonu').innerText = "Veriler İşleniyor, Lütfen Bekleyin...";
    
    // "Cevaplandi_X" anahtarlarını silerek temiz bir JSON gönderiyoruz
    let temizCevaplar = {};
    for (let key in secilenYanitlar) {
        if (!key.startsWith('Cevaplandi_')) {
            temizCevaplar[key] = secilenYanitlar[key];
        }
    }

    fetch('/api/anket-kaydet', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ogrenci_id: ogrenciId, dolduran_tipi: tip, cevaplar: temizCevaplar })
    })
    .then(res => res.json())
    .then(data => {
        if (data.durum === 'basarili') {
            alert('Anketiniz başarıyla MEB standartlarında kaydedilmiştir. Katkılarınız için teşekkür ederiz!');
            if (tip === 'Ogretmen') { window.location.href = '/panel/ogretmen'; }
            else { window.location.href = '/'; }
        } else {
            alert('Sistemsel Hata: ' + data.mesaj);
            document.getElementById('kaydet_butonu').innerText = "Anketi Kaydet ve Tamamla";
        }
    });
}

// Sistemi Başlat
anketArayuzunuKur();
</script>
