<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RİBA - Öğretmen Formu</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            margin: 0; 
            padding: 10px; 
        }
        .container { 
            background-color: white; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); 
            max-width: 700px; 
            margin: 15px auto; 
        }
        .header { 
            text-align: center; 
            border-bottom: 3px solid #e67e22; 
            padding-bottom: 15px; 
            margin-bottom: 20px; 
        }
        .header h2 { 
            color: #2c3e50; 
            margin: 5px 0; 
            font-size: 20px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: bold;
            font-size: 15px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #e67e22;
        }
        .info-box { 
            background-color: #fef5e7; 
            padding: 14px; 
            border-radius: 6px; 
            font-size: 15px; 
            color: #7e5109; 
            margin-bottom: 20px; 
            line-height: 1.5;
            border-left: 5px solid #e67e22;
        }
        .madde-kart { 
            background-color: #fff; 
            border: 1px solid #e2e8f0; 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
        }
        .madde-no { 
            font-weight: bold; 
            color: #d35400; 
            font-size: 16px; 
            margin-bottom: 12px; 
            border-bottom: 1px dashed #f5cba7;
            padding-bottom: 5px;
        }
        .secenek-btn { 
            display: block; 
            width: 100%; 
            text-align: left; 
            background: #f8f9f9; 
            border: 2px solid #cbd5e1; 
            padding: 15px; 
            border-radius: 6px; 
            margin-top: 10px; 
            cursor: pointer; 
            font-size: 15px; 
            line-height: 1.5;
            color: #334155;
            transition: all 0.2s ease; 
        }
        .secenek-btn:hover { 
            background: #f1f5f9; 
            border-color: #94a3b8; 
        }
        .secenek-btn.active { 
            background: #fdebd0; 
            border-color: #e67e22; 
            color: #6e2c00;
            font-weight: bold; 
        }
        .submit-btn { 
            width: 100%; 
            background-color: #e67e22; 
            color: white; 
            padding: 16px; 
            border: none; 
            border-radius: 6px; 
            font-size: 18px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 25px; 
            box-shadow: 0 4px 6px rgba(230, 126, 34, 0.2);
        }
        .submit-btn:hover { 
            background-color: #d35400; 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Rehberlik İhtiyaç Belirleme Anketi - ÖĞRETMEN FORMU</h2>
    </div>

    <div class="form-group">
        <label for="ogretmen_adi">Adınız Soyadınız (İsteğe Bağlı):</label>
        <input type="text" id="ogretmen_adi" placeholder="Örn: Değerli Öğretmenimiz" autocomplete="off">
    </div>

    <div class="info-box">
        <strong>Sayın Öğretmenimiz,</strong><br>
        Bu ölçek okulumuzun rehberlik programı ihtiyaçlarını belirlemek için hazırlanmıştır. Lütfen maddeleri inceleyerek okulun genel durumu açısından en uygun bulduğunuz <strong>yalnızca tek seçeneği</strong> işaretleyiniz.
    </div>

    <div id="anket_maddeleri"></div>

    <button class="submit-btn" onclick="ogretmenAnketiKaydet()">Öğretmen Anketini Tamamla ve Gönder</button>
</div>

<script>
// MEB Öğretmen Şablonu Maddeleri (Frekans ve ASP formülleriyle birebir ilişkili kodlar)
const maddelerVerisi = [
    {
        "kod": "M12",
        "A": "Öğrencilerin problem çözme becerilerini güçlendirmeye yönelik çalışmalar yapılması gereklidir.",
        "B": "Mevcut durumda öğrencilerin problem çözme becerileri okul genelinde yeterlidir."
    },
    {
        "kod": "M30",
        "A": "Öğrencilerin ders çalışma becerilerini (plan yapma, öz değerlendirme vb.) geliştirecek rehberlik hizmetlerine yoğun ihtiyaç vardır.",
        "B": "Öğrencilerin ders çalışma alışkanlıkları ve motivasyon düzeyleri okul genelinde yeterlidir."
    },
    {
        "kod": "M08",
        "A": "Öğrencilerin kendi hayatlarıyla ilgili karar alma becerilerini güçlendirecek etkinlikler yapılmalıdır.",
        "B": "Öğrencilerin karar verme ve sorumluluk alma düzeyleri okul bünyesinde yeterli durumdadır."
    }
];

let secilenYanitlar = {};

function ogretmenArayuzunuKur() {
    const mainContainer = document.getElementById('anket_maddeleri');
    maddelerVerisi.forEach((madde, index) => {
        const kart = document.createElement('div');
        kart.className = 'madde-kart';
        kart.innerHTML = `
            <div class="madde-no">Öğretmen Maddesi ${index + 1}</div>
            <button class="secenek-btn" id="${madde.kod}_A" onclick="secimGuncelle('${madde.kod}', 'A')"><strong>A)</strong> ${madde.A}</button>
            <button class="secenek-btn" id="${madde.kod}_B" onclick="secimGuncelle('${madde.kod}', 'B')"><strong>B)</strong> ${madde.B}</button>
        `;
        mainContainer.appendChild(kart);
    });
}

function secimGuncelle(maddeKod, tercih) {
    document.getElementById(`${maddeKod}_A`).classList.remove('active');
    document.getElementById(`${maddeKod}_B`).classList.remove('active');
    document.getElementById(`${maddeKod}_${tercih}`).classList.add('active');
    
    secilenYanitlar[maddeKod] = {
        "A": tercih === 'A' ? 1 : 0,
        "B": tercih === 'B' ? 1 : 0
    };
}

function ogretmenAnketiKaydet() {
    const toplamSoru = maddelerVerisi.length;
    const cevaplananSoru = Object.keys(secilenYanitlar).length;

    if (cevaplananSoru < toplamSoru) {
        alert(`Lütfen tüm maddeleri cevaplayınız. (Cevaplanan: ${cevaplananSoru}/${toplamSoru})`);
        return;
    }

    let isim = document.getElementById('ogretmen_adi').value.trim();
    if (isim === "") { isim = "Okul Öğretmeni"; }

    const veriPaketi = {
        ogretmen_adi: isim,
        cevaplar: secilenYanitlar
    };

    fetch('/ogretmen-kaydet', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(veriPaketi)
    })
    .then(res => res.json())
    .then(data => {
        if (data.durum === 'basarili') {
            alert('Değerli katkılarınız için teşekkür ederiz. Öğretmen anket sonuçları sisteme kaydedildi.');
            window.location.href = '/';
        } else {
            alert('Hata: ' + data.mesaj);
        }
    })
    .catch(err => {
        console.error("Öğretmen kaydetme hatası:", err);
        alert("Bağlantı kesildi. Lütfen internetinizi kontrol edip tekrar deneyiniz.");
    });
}

ogretmenArayuzunuKur();
</script>
</body>
</html>
