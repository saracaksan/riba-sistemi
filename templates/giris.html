<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RİBA - Giriş Ekranı</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 450px; width: 100%; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 20px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; color: #34495e; font-weight: bold; }
        input[type="number"], select { width: 100%; padding: 12px; border: 1px solid #bdc3c7; border-radius: 5px; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; background-color: #2ecc71; color: white; padding: 14px; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        .btn:hover { background-color: #27ae60; }
        .error-msg { color: #e74c3c; margin-top: 15px; font-weight: bold; display: none; }
        .welcome-box { background-color: #e8f8f5; border: 1px solid #a3e4d7; padding: 15px; border-radius: 5px; margin-top: 15px; display: none; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h2>Öğrenci / Veli Doğrulama</h2>
    
    <div class="form-group">
        <label for="okul_no">Öğrenci Okul Numarası:</label>
        <input type="number" id="okul_no" placeholder="Örn: 145" oninput="ogrenciSorgula()">
    </div>

    <div id="hoşgeldin_alani" class="welcome-box">
        <p><strong>Öğrenci:</strong> <span id="ogrenci_adi">...</span></p>
        <p><strong>Sınıfı:</strong> <span id="sinif_adi">...</span></p>
        
        <div class="form-group" style="margin-top: 15px;">
            <label for="anket_tipi">Anketi Kim Dolduruyor?</label>
            <select id="anket_tipi">
                <option value="Ogrenci">Ben Öğrenciyim (Kendim dolduruyorum)</option>
                <option value="Veli">Ben Veliyim (Çocuğum için dolduruyorum)</option>
            </select>
        </div>
        
        <button class="btn" onclick="anketeBasla()">Anketi Başlat</button>
    </div>

    <div id="hata_mesaji" class="error-msg">Bu okul numarasına ait bir öğrenci bulunamadı. Lütfen numarayı kontrol ediniz.</div>
</div>

<script>
let bulunanOgrenciId = null;

function ogrenciSorgula() {
    const okulNo = document.getElementById('okul_no').value;
    const hosgeldinAlani = document.getElementById('hoşgeldin_alani');
    const hataMesaji = document.getElementById('hata_mesaji');

    if (okulNo.length < 1) {
        hosgeldinAlani.style.display = 'none';
        hataMesaji.style.display = 'none';
        return;
    }

    // Arka planda Python'a soruyoruz: "Bu numarada kim var?"
    fetch(`/ogrenci-sorgula/${okulNo}`)
        .then(response => response.json())
        .then(data => {
            if (data.durum === 'basarili') {
                bulunanOgrenciId = data.veri.id;
                document.getElementById('ogrenci_adi').innerText = data.veri.ad_soyad;
                document.getElementById('sinif_adi').innerText = data.veri.siniflar.sinif_adi;
                
                hosgeldinAlani.style.display = 'block';
                hataMesaji.style.display = 'none';
            } else {
                hosgeldinAlani.style.display = 'none';
                hataMesaji.style.display = 'block';
                bulunanOgrenciId = null;
            }
        })
        .catch(err => {
            console.error("Sorgulama hatası:", err);
        });
}

function anketeBasla() {
    const tip = document.getElementById('anket_tipi').value;
    if (bulunanOgrenciId) {
        // Seçilen tipe göre (Öğrenci veya Veli) ilgili anket sayfasına yönlendiriyoruz
        window.location.href = `/anket-formu?ogrenci_id=${bulunanOgrenciId}&tip=${tip}`;
    }
}
</script>

</body>
</html>
